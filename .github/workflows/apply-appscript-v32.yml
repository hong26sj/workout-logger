name: Apply Apps Script v3.2 patch

# One-shot workflow. It removes itself after applying the update.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('WorkoutLogger_Code_AI_Integrated_v3.gs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("prompt_version:'3.1'", "prompt_version:'3.2'")
          old = "nutrition_analysis:{type:'object',additionalProperties:false,properties:{status:{type:'string',enum:['양호','주의','부족','자료 없음']},summary:{type:'string'},evidence:{type:'array',items:{type:'string'}},limitations:{type:'array',items:{type:'string'}}},required:['status','summary','evidence','limitations']},"
          new = """nutrition_analysis:{type:'object',additionalProperties:false,properties:{
                status:{type:'string',enum:['양호','주의','부족','자료 없음']},
                summary:{type:'string'},
                evidence:{type:'array',items:{type:'string'}},
                limitations:{type:'array',items:{type:'string'}},
                nutrient_recommendations:{type:'array',maxItems:3,items:{type:'object',additionalProperties:false,properties:{
                  nutrient:{type:'string'},
                  priority:{type:'string',enum:['높음','보통','낮음']},
                  reason:{type:'string'},
                  foods:{type:'array',minItems:1,maxItems:4,items:{type:'string'}}
                },required:['nutrient','priority','reason','foods']}}
              },required:['status','summary','evidence','limitations','nutrient_recommendations']},"""
          if old not in s:
              raise SystemExit('nutrition schema block not found')
          s = s.replace(old, new)
          anchor = "    '영양 추정 규칙: incomplete 기록일의 estimated_complete_total은 누락된 주식사에 대해 같은 meal_type의 근접 기록 중앙값으로 보정한 추정치다. 실제 기록과 추정치를 반드시 구분하고, 추정치를 사실처럼 표현하지 않는다. complete 실제값 > estimated_complete_total > incomplete recorded_total(lower bound) 순으로 신뢰한다.',"
          extra = """    '영양 화면 요약 규칙: nutrition_analysis.summary는 모바일 화면에서 읽기 쉽게 핵심 판단만 한국어 2문장 이내, 가급적 180자 이내로 작성한다. 상세 근거는 evidence와 limitations에 분리한다.',
              '추천 식단 규칙: nutrition_analysis.nutrient_recommendations는 최대 3개만 작성한다. 실제 Nutrition 기록 또는 제공된 통계로 부족/보완 필요성을 뒷받침할 수 있는 영양소·영양 목표만 선택하고, 데이터가 없는 미량영양소를 임의로 결핍이라고 추정하지 않는다. 각 항목 foods에는 한국에서 쉽게 구할 수 있는 음식 1~4개를 구체적으로 제안한다. 부족 근거가 없으면 빈 배열을 반환한다.',"""
          if extra not in s:
              if anchor not in s:
                  raise SystemExit('nutrition prompt anchor not found')
              s = s.replace(anchor, anchor + '\n' + extra)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f WorkoutLogger_Code_AI_Integrated_v3.2.patch
          rm .github/workflows/apply-appscript-v32.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update integrated Apps Script to prompt v3.2"
          git push origin HEAD:main
