name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: AKfycbxsQLOyMwtGe2lM8oTl6ABjH_WKM1ko2OUKPy0NjCtdLmYVE4ly9NKIq2C7QI58WhZELA
      STABLE_VERSION: '40'
      WEB_APP_URL: https://script.google.com/macros/s/AKfycbxsQLOyMwtGe2lM8oTl6ABjH_WKM1ko2OUKPy0NjCtdLmYVE4ly9NKIq2C7QI58WhZELA/exec
    steps:
      - uses: actions/checkout@v4

      - name: Prepare clasp authentication
        id: auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLASPRC_JSON secret is not configured."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.0

      - name: Push Apps Script source
        run: clasp push --force

      - name: Redeploy existing web app
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA}"

      - name: Smoke test deployed API
        id: smoke
        continue-on-error: true
        run: |
          sleep 3
          response=$(curl -sS -L --fail --max-time 30 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data '{"action":"auth_check","auth_token":"github-smoke-test-invalid"}' \
            "$WEB_APP_URL")
          echo "$response"
          printf '%s' "$response" | grep -q 'UNAUTHORIZED'

      - name: Roll back if smoke test fails
        if: steps.smoke.outcome != 'success'
        run: |
          echo "Smoke test failed. Rolling deployment back to version $STABLE_VERSION."
          clasp deploy --versionNumber "$STABLE_VERSION" --deploymentId "$DEPLOYMENT_ID" --description "Automatic rollback after failed smoke test"
          exit 1
