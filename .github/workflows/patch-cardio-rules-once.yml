name: Patch cardio rules once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cardio-rules-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cardio classification and exclusion rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps-script/Analysis.gs')
          text = path.read_text(encoding='utf-8')

          old_display = r"""  const cardioDisplayName=(w,distanceKm,paceMinPerKm,cadenceSpm,isWalkRun)=>{
            const name=String(w&&w.name||'');
            if(!isWalkRun)return name||'\uC6B4\uB3D9';
            const genericIndoor=/^\s*(\uC2E4\uB0B4\s*\uC6B4\uB3D9|Indoor\s+Workout)\s*$/i.test(name);
            if(!genericIndoor)return name||'\uC6B4\uB3D9';
            if(Number(distanceKm)>0&&Number(paceMinPerKm)>0&&Number(cadenceSpm)>0){
              return Number(paceMinPerKm)<=10||Number(cadenceSpm)>=120?'\uC2E4\uB0B4 \uB2EC\uB9AC\uAE30':'\uC2E4\uB0B4 \uAC77\uAE30';
            }
            return name||'\uC6B4\uB3D9';
          };"""

          new_display = r"""  const cardioDisplayName=(w,distanceKm,paceMinPerKm,cadenceSpm,isWalkRun)=>{
            const name=String(w&&w.name||'');
            if(!isWalkRun)return name||'운동';
            const genericIndoor=/^\s*(실내\s*운동|Indoor\s+Workout)\s*$/i.test(name);
            const genericOutdoor=/^\s*(야외\s*운동|Outdoor\s+Workout)\s*$/i.test(name);
            if(!genericIndoor&&!genericOutdoor)return name||'운동';
            if(Number(distanceKm)>0&&Number(paceMinPerKm)>0&&Number(cadenceSpm)>0){
              const isRun=Number(paceMinPerKm)<=10||Number(cadenceSpm)>=120;
              if(genericIndoor)return isRun?'실내 달리기':'실내 걷기';
              return isRun?'야외 달리기':'야외 걷기';
            }
            return name||'운동';
          };"""

          old_exclusion = r"""  const routeCounts={};
          workouts.forEach(w=>{if(w.is_walk_run&&w.route_signature)routeCounts[w.route_signature]=(routeCounts[w.route_signature]||0)+1;});
          workouts.forEach(w=>{
            w.is_commute_like=!!(w.route_signature&&routeCounts[w.route_signature]>1);
            w.is_slow_outdoor_walk=!!(w.has_gps_route&&Number(w.pace_min_per_km)>=15);
            w.cardio_exclusion_reason=w.is_commute_like?'repeated_gps_route':(w.is_slow_outdoor_walk?'slow_outdoor_walk':null);
          });"""

          new_exclusion = r"""  workouts.forEach(w=>{
            // 유산소 제외 여부는 GPS/경로 반복과 무관하게 평균 페이스만 사용합니다.
            w.is_slow_pace=!!(w.is_walk_run&&Number(w.pace_min_per_km)>=15);
            w.cardio_exclusion_reason=w.is_slow_pace?'slow_pace':null;
          });"""

          if old_display not in text:
              raise SystemExit('cardioDisplayName target block not found')
          if old_exclusion not in text:
              raise SystemExit('cardio exclusion target block not found')

          text = text.replace(old_display, new_display, 1)
          text = text.replace(old_exclusion, new_exclusion, 1)

          # Safety checks: removed rules must be gone and new rules present.
          for forbidden in ('repeated_gps_route', 'slow_outdoor_walk', 'is_commute_like'):
              if forbidden in text:
                  raise SystemExit(f'forbidden legacy rule still present: {forbidden}')
          for required in ('genericOutdoor', "'야외 달리기'", "'야외 걷기'", "'slow_pace'"):
              if required not in text:
                  raise SystemExit(f'missing new rule: {required}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit patch
        run: |
          git rm .github/workflows/patch-cardio-rules-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Analysis.gs
          git diff --cached --check
          git commit -m "Update cardio classification and pace-only exclusion"
          git push origin HEAD:main
